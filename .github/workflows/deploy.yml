name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          SITE_URL: https://lanstaxi.se
      # Browser tests on the built site: contact links, booking form, car scene. A failure stops the deploy.
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # Tell Bing (and other IndexNow search engines) that the pages changed, so they recrawl soon.
      # The key is public by design: it must match public/a891098ddb2422d4fa364c0c5aff02c1.txt on the live site.
      # A failed ping never fails the deploy; Bing still finds changes through the sitemap.
      - name: Ping IndexNow
        continue-on-error: true
        env:
          INDEXNOW_KEY: a891098ddb2422d4fa364c0c5aff02c1
        run: |
          urls=$(curl -fsS https://lanstaxi.se/sitemap-0.xml | grep -o '<loc>[^<]*</loc>' | sed -e 's/<loc>//' -e 's/<\/loc>//' | jq -R . | jq -sc .)
          echo "Submitting: $urls"
          curl -fsS -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"lanstaxi.se\",\"key\":\"$INDEXNOW_KEY\",\"keyLocation\":\"https://lanstaxi.se/$INDEXNOW_KEY.txt\",\"urlList\":$urls}" \
            -w 'IndexNow answered HTTP %{http_code}\n'
